# Release artifact (TASK-FND-016, ADR-0003, ADR-0008).
#
# Builds and verifies the production artifact: Composer production dependencies
# and prebuilt Vite assets, so the shared host needs neither Composer nor Node.
# On a tag it also publishes the verified tree to the generated `release` branch,
# which the shared host pulls with deploy/host-release.sh (owner decision D1:
# Git deployment). It never connects to the host; a person runs the update.
#
# Only tag commits whose CI run is green (docs/OPERATIONS/DEPLOYMENT-RUNBOOK.md).
name: Release artifact

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Tag matches the application version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(sed -n 's/^APP_VERSION=//p' .env.example | head -n1)"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match APP_VERSION v${version} in .env.example." >&2
            exit 1
          fi
          grep -Eq "^## \[${version}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md \
            || { echo "CHANGELOG.md has no dated section for ${version}." >&2; exit 1; }

      - name: Build the artifact
        run: scripts/release/build.sh

      - name: Verify the artifact
        run: scripts/release/verify.sh build/release/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: innsync-release
          path: |
            build/release/*.zip
            build/release/*.sha256
          if-no-files-found: error
          retention-days: 30

  publish-branch:
    name: Publish to the release branch
    needs: artifact
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: innsync-release
          path: build/release

      - name: Check the checksum, then publish
        run: |
          (cd build/release && sha256sum -c ./*.sha256)
          scripts/release/publish-release-branch.sh build/release/*.zip
